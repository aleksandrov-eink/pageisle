<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metalio S31 一键刷机 · 页屿 PageIsle</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../style.css"></head>
<body>
<div style="background:#2e5a45;color:#f6f2e7;padding:10px 16px;font-size:14px;text-align:center">
内测通道 · 选择设备： <a style="color:#e8dcc0" href="../">Pico（原设备）</a> ｜ <b>Metalio S31</b> ｜
<a style="color:#e8dcc0" href="../../">回到正式版</a></div>
<header class="top"><div class="wrap"><div class="brand">页屿 <span>PageIsle</span> · Metalio S31 一键刷机</div>
<nav><a href="./">返回 Metalio 内测页</a></nav></div></header>
<main class="wrap"><section style="padding-top:24px"><div class="card" style="border:1px solid #b9a98a">
<h1 style="margin-top:0">一键刷机</h1>
<p class="hint">使用电脑版 Chrome/Edge + USB 数据线。流程与 Pico 相同：连接 → 确认 → 自动刷入。</p>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0">
<button id="connect" type="button">① 连接设备</button>
<button id="flash" type="button" disabled>② 开始升级</button>
<button id="disconnect" type="button" disabled>断开</button></div>
<div id="status" style="padding:10px 12px;border-radius:8px;background:#f3eee1">等待连接设备…</div>
<progress id="progress" value="0" max="100" style="width:100%"></progress>
<p id="progress-label" class="hint">0%</p><pre id="log" style="max-height:220px;overflow:auto;background:#1f241f;color:#d8e6cf;padding:10px;border-radius:8px"></pre>
<p class="hint">本页只写应用分区与 OTA 选择区，不擦除书籍/设置；失败可用 TF 卡包回刷。</p>
</div></section></main>
<script type="module" src="./flasher/flash-app.js"></script>
</body></html>
